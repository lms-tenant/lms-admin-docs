<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>User menu · directions</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Geist:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  /* Token system — locked to indigo + Bricolage/Geist to match the project */
  :root {
    --font-display: "Bricolage Grotesque", "Inter Tight", system-ui, sans-serif;
    --font-body: "Geist", "Inter", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;

    --primary-h: 270; --primary-c: 0.16; --primary-l: 0.55;
    --primary: oklch(var(--primary-l) var(--primary-c) var(--primary-h));
    --primary-hover: oklch(calc(var(--primary-l) - 0.05) var(--primary-c) var(--primary-h));
    --primary-soft: oklch(0.96 0.035 var(--primary-h));
    --primary-soft-fg: oklch(0.32 calc(var(--primary-c) * 0.9) var(--primary-h));
    --on-primary: oklch(0.99 0.005 var(--primary-h));

    --r: 10px;
    --r-sm: max(2px, calc(var(--r) * 0.45));
    --r-md: var(--r);
    --r-lg: calc(var(--r) * 1.6);
    --r-pill: 9999px;

    --t-12: 12px; --t-13: 13px; --t-14: 14px; --t-15: 15px;
    --t-16: 16px; --t-18: 18px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  #root { height: 100%; }

  /* Theme scopes — set on each artboard so artboards can independently be light or dark */
  .theme-light {
    --bg:           oklch(0.985 0.003 80);
    --bg-sub:       oklch(0.97 0.004 80);
    --surface:      #ffffff;
    --surface-sub: oklch(0.975 0.004 80);
    --ink-1:        oklch(0.18 0.011 80);
    --ink-2:        oklch(0.34 0.009 80);
    --ink-3:        oklch(0.52 0.008 80);
    --ink-4:        oklch(0.66 0.007 80);
    --ink-5:        oklch(0.8 0.005 80);
    --border:       oklch(0.92 0.005 80);
    --border-strong: oklch(0.85 0.006 80);
    --shadow-menu:  0 12px 28px -8px oklch(0.18 0.01 80 / 0.18),
                    0 4px 10px -4px oklch(0.18 0.01 80 / 0.1);

    --success: oklch(0.62 0.13 155);
    --success-soft: oklch(0.95 0.04 155);
    --danger: oklch(0.6 0.17 25);
    --danger-soft: oklch(0.96 0.04 25);
    --warning: oklch(0.74 0.13 75);
    --warning-soft: oklch(0.96 0.05 75);
  }
  .theme-dark {
    --bg:           oklch(0.16 0.013 265);
    --bg-sub:       oklch(0.2 0.013 265);
    --surface:      oklch(0.22 0.013 265);
    --surface-sub: oklch(0.26 0.012 265);
    --ink-1:        oklch(0.97 0.005 80);
    --ink-2:        oklch(0.84 0.006 80);
    --ink-3:        oklch(0.66 0.007 80);
    --ink-4:        oklch(0.52 0.007 80);
    --ink-5:        oklch(0.4 0.008 80);
    --border:       oklch(0.32 0.012 265);
    --border-strong: oklch(0.4 0.012 265);
    --shadow-menu:  0 16px 40px -8px rgba(0,0,0,.5),
                    0 4px 12px -4px rgba(0,0,0,.4);
    --primary-soft: oklch(0.3 0.07 var(--primary-h));
    --primary-soft-fg: oklch(0.88 0.07 var(--primary-h));
    --success: oklch(0.78 0.12 155);
    --success-soft: oklch(0.3 0.05 155);
    --danger: oklch(0.75 0.15 25);
    --danger-soft: oklch(0.3 0.06 25);
    --warning: oklch(0.85 0.13 75);
    --warning-soft: oklch(0.3 0.06 75);
  }

  .stage {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--ink-1);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* mini navbar — represents the top bar from the screenshot */
  .navbar {
    flex-shrink: 0;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 22px;
    padding: 0 24px;
    font-family: var(--font-body);
    font-size: var(--t-14);
  }
  .navbar .brand-mark {
    width: 28px; height: 28px;
    background: var(--primary); color: var(--on-primary);
    border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 14px;
  }
  .navbar .nav-links {
    display: flex; gap: 22px;
    color: var(--ink-3);
  }
  .navbar .nav-links a { cursor: pointer; }
  .navbar .nav-links a.on { color: var(--primary); font-weight: 500; position: relative; }
  .navbar .nav-links a.on::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -19px;
    height: 2px; background: var(--primary); border-radius: 2px;
  }
  .navbar .grow { flex: 1; }
  .navbar .icon-btn {
    appearance: none; border: 0; background: transparent;
    width: 32px; height: 32px; border-radius: var(--r-sm);
    color: var(--ink-2); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    position: relative;
  }
  .navbar .icon-btn .badge-dot {
    position: absolute; top: 6px; right: 6px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--success);
    border: 2px solid var(--surface);
  }
  .navbar .me {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 8px 4px 4px;
    border-radius: var(--r-pill);
    background: var(--bg-sub);
    cursor: pointer;
  }
  .navbar .me .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--primary-soft); color: var(--primary-soft-fg);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
  }
  .navbar .me .name { color: var(--ink-1); font-size: var(--t-13); font-weight: 500; }

  .stage-body {
    flex: 1; min-height: 0; padding: 14px 24px;
    display: flex; justify-content: flex-end;
    background-image:
      radial-gradient(circle at 12% 12%, var(--primary-soft) 0%, transparent 50%),
      var(--bg);
    background-blend-mode: normal;
  }

  /* Anchor — where the menu would attach (right-aligned, under "me") */
  .anchor { position: relative; display: inline-block; }
</style>
</head>
<body>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="primitives.jsx"></script>
