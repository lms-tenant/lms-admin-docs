<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SkillsRamp Design System</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Geist:wght@300;400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  /* ─── TOKENS ───────────────────────────────────────────── */
  :root {
    /* Font pairings (driven by --font-pair) */
    --font-display: "Bricolage Grotesque", "Inter Tight", system-ui, sans-serif;
    --font-body: "Geist", "Inter", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;

    /* Primary (white-label swappable). Default = SkillsRamp emerald in OKLCH. */
    --primary-h: 165;
    --primary-c: 0.13;
    --primary-l: 0.58;
    --primary: oklch(var(--primary-l) var(--primary-c) var(--primary-h));
    --primary-hover: oklch(calc(var(--primary-l) - 0.05) var(--primary-c) var(--primary-h));
    --primary-soft: oklch(0.96 0.035 var(--primary-h));
    --primary-soft-fg: oklch(0.32 calc(var(--primary-c) * 0.9) var(--primary-h));
    --primary-ring: oklch(var(--primary-l) var(--primary-c) var(--primary-h) / 0.35);
    --on-primary: oklch(0.99 0.005 var(--primary-h));

    /* Neutrals — warm-leaning so primary harmonizes regardless of hue */
    --bg: oklch(0.985 0.003 80);
    --bg-sub: oklch(0.97 0.004 80);
    --surface: #ffffff;
    --surface-sub: oklch(0.975 0.004 80);
    --ink-1: oklch(0.18 0.011 80);
    --ink-2: oklch(0.34 0.009 80);
    --ink-3: oklch(0.52 0.008 80);
    --ink-4: oklch(0.66 0.007 80);
    --ink-5: oklch(0.8 0.005 80);
    --border: oklch(0.92 0.005 80);
    --border-strong: oklch(0.85 0.006 80);
    --border-input: oklch(0.88 0.006 80);
    --overlay: oklch(0.18 0.011 80 / 0.55);

    /* Semantic — share chroma/lightness, vary hue */
    --success: oklch(0.62 0.13 155);
    --success-soft: oklch(0.95 0.04 155);
    --warning: oklch(0.74 0.13 75);
    --warning-soft: oklch(0.96 0.05 75);
    --danger: oklch(0.6 0.17 25);
    --danger-soft: oklch(0.96 0.04 25);
    --info: oklch(0.6 0.13 245);
    --info-soft: oklch(0.96 0.035 245);

    /* Radius scale */
    --r: 10px;
    --r-sm: max(2px, calc(var(--r) * 0.45));
    --r-md: var(--r);
    --r-lg: calc(var(--r) * 1.6);
    --r-pill: 9999px;

    /* Density — drives padding / gap globally */
    --d-y: 10px;
    --d-x: 14px;
    --d-gap: 12px;
    --d-row: 1.55;
    --ctl-h: 38px;
    --ctl-h-sm: 30px;
    --ctl-h-lg: 46px;

    /* Type scale */
    --t-12: 12px;
    --t-13: 13px;
    --t-14: 14px;
    --t-15: 15px;
    --t-16: 16px;
    --t-18: 18px;
    --t-20: 20px;
    --t-24: 24px;
    --t-32: 32px;
    --t-44: 44px;
    --t-64: 64px;
    --t-88: 88px;

    /* Elevation — restrained */
    --shadow-1: 0 1px 2px 0 oklch(0.18 0.01 80 / 0.05);
    --shadow-2: 0 1px 3px 0 oklch(0.18 0.01 80 / 0.08),
                0 1px 2px -1px oklch(0.18 0.01 80 / 0.06);
    --shadow-3: 0 6px 16px -4px oklch(0.18 0.01 80 / 0.1),
                0 2px 6px -2px oklch(0.18 0.01 80 / 0.06);
    --shadow-4: 0 18px 40px -12px oklch(0.18 0.01 80 / 0.18),
                0 6px 14px -6px oklch(0.18 0.01 80 / 0.1);
  }

  /* Density variants */
  [data-density="compact"] {
    --d-y: 6px; --d-x: 10px; --d-gap: 8px; --d-row: 1.45;
    --ctl-h: 32px; --ctl-h-sm: 26px; --ctl-h-lg: 40px;
  }
  [data-density="spacious"] {
    --d-y: 14px; --d-x: 18px; --d-gap: 16px; --d-row: 1.65;
    --ctl-h: 44px; --ctl-h-sm: 36px; --ctl-h-lg: 52px;
  }

  /* Font pairings */
  [data-pair="bricolage"] {
    --font-display: "Bricolage Grotesque", system-ui, sans-serif;
    --font-body: "Geist", "Inter", system-ui, sans-serif;
  }
  [data-pair="intertight"] {
    --font-display: "Inter Tight", system-ui, sans-serif;
    --font-body: "Inter", system-ui, sans-serif;
  }
  [data-pair="grotesk"] {
    --font-display: "Space Grotesk", system-ui, sans-serif;
    --font-body: "DM Sans", "Inter", system-ui, sans-serif;
  }
  [data-pair="editorial"] {
    --font-display: "Instrument Serif", Georgia, serif;
    --font-body: "Geist", "Inter", system-ui, sans-serif;
  }

  /* Dark mode */
  [data-theme="dark"] {
    --bg: oklch(0.14 0.008 80);
    --bg-sub: oklch(0.17 0.009 80);
    --surface: oklch(0.19 0.009 80);
    --surface-sub: oklch(0.22 0.009 80);
    --ink-1: oklch(0.97 0.005 80);
    --ink-2: oklch(0.84 0.006 80);
    --ink-3: oklch(0.66 0.007 80);
    --ink-4: oklch(0.52 0.007 80);
    --ink-5: oklch(0.38 0.008 80);
    --border: oklch(0.28 0.008 80);
    --border-strong: oklch(0.36 0.008 80);
    --border-input: oklch(0.32 0.008 80);
    --overlay: oklch(0.05 0.01 80 / 0.65);
    --primary-soft: oklch(0.28 0.06 var(--primary-h));
    --primary-soft-fg: oklch(0.88 0.07 var(--primary-h));
    --success-soft: oklch(0.28 0.05 155);
    --warning-soft: oklch(0.3 0.06 75);
    --danger-soft: oklch(0.3 0.06 25);
    --info-soft: oklch(0.28 0.05 245);
    --shadow-1: 0 1px 2px 0 #0008;
    --shadow-2: 0 1px 3px 0 #000a, 0 1px 2px -1px #0006;
    --shadow-3: 0 6px 16px -4px #000a, 0 2px 6px -2px #0006;
    --shadow-4: 0 18px 40px -12px #000c, 0 6px 14px -6px #0008;
  }

  /* ─── BASE ─────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink-1);
    font-family: var(--font-body);
    font-size: var(--t-15);
    line-height: var(--d-row);
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-display);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin: 0;
    color: var(--ink-1);
  }
  p { margin: 0; }
  a { color: inherit; }
  button { font-family: inherit; }
  hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 0;
  }
  ::selection { background: var(--primary); color: var(--on-primary); }

  /* Hide app shell until React mounts so unstyled markup doesn't flash */
  #root:empty::before {
    content: "";
    display: block;
    height: 100vh;
    background: var(--bg);
  }
</style>
</head>
<body>
