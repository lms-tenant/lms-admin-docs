<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SkillsRamp · Branding</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Geist:wght@300;400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    /* Admin chrome — locked. Only the tenant brand inside .preview-stage swaps. */
    --font-display: "Bricolage Grotesque", "Inter Tight", system-ui, sans-serif;
    --font-body: "Geist", "Inter", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;

    --primary-h: 270; --primary-c: 0.16; --primary-l: 0.5;
    --primary: oklch(var(--primary-l) var(--primary-c) var(--primary-h));
    --primary-hover: oklch(calc(var(--primary-l) - 0.05) var(--primary-c) var(--primary-h));
    --primary-soft: oklch(0.96 0.035 var(--primary-h));
    --primary-soft-fg: oklch(0.32 calc(var(--primary-c) * 0.9) var(--primary-h));
    --primary-ring: oklch(var(--primary-l) var(--primary-c) var(--primary-h) / 0.35);
    --on-primary: oklch(0.99 0.005 var(--primary-h));

    --bg: oklch(0.985 0.003 80);
    --bg-sub: oklch(0.97 0.004 80);
    --surface: #ffffff;
    --surface-sub: oklch(0.975 0.004 80);
    --ink-1: oklch(0.18 0.011 80);
    --ink-2: oklch(0.34 0.009 80);
    --ink-3: oklch(0.52 0.008 80);
    --ink-4: oklch(0.66 0.007 80);
    --ink-5: oklch(0.8 0.005 80);
    --border: oklch(0.92 0.005 80);
    --border-strong: oklch(0.85 0.006 80);
    --border-input: oklch(0.88 0.006 80);
    --overlay: oklch(0.18 0.011 80 / 0.55);

    --success: oklch(0.62 0.13 155);
    --success-soft: oklch(0.95 0.04 155);
    --warning: oklch(0.74 0.13 75);
    --warning-soft: oklch(0.96 0.05 75);
    --danger: oklch(0.6 0.17 25);
    --danger-soft: oklch(0.96 0.04 25);
    --info: oklch(0.6 0.13 245);
    --info-soft: oklch(0.96 0.035 245);

    --r: 10px;
    --r-sm: max(2px, calc(var(--r) * 0.45));
    --r-md: var(--r);
    --r-lg: calc(var(--r) * 1.6);
    --r-pill: 9999px;

    --d-y: 10px; --d-x: 14px; --d-gap: 12px; --d-row: 1.55;
    --ctl-h: 38px; --ctl-h-sm: 30px; --ctl-h-lg: 46px;

    --t-12: 12px; --t-13: 13px; --t-14: 14px; --t-15: 15px;
    --t-16: 16px; --t-18: 18px; --t-20: 20px; --t-24: 24px;
    --t-32: 32px; --t-44: 44px;

    --shadow-1: 0 1px 2px 0 oklch(0.18 0.01 80 / 0.05);
    --shadow-2: 0 1px 3px 0 oklch(0.18 0.01 80 / 0.08), 0 1px 2px -1px oklch(0.18 0.01 80 / 0.06);
    --shadow-3: 0 6px 16px -4px oklch(0.18 0.01 80 / 0.1), 0 2px 6px -2px oklch(0.18 0.01 80 / 0.06);
    --shadow-4: 0 18px 40px -12px oklch(0.18 0.01 80 / 0.2), 0 6px 14px -6px oklch(0.18 0.01 80 / 0.12);
  }

  [data-theme="dark"] {
    --bg: oklch(0.14 0.008 80);
    --bg-sub: oklch(0.17 0.009 80);
    --surface: oklch(0.19 0.009 80);
    --surface-sub: oklch(0.22 0.009 80);
    --ink-1: oklch(0.97 0.005 80);
    --ink-2: oklch(0.84 0.006 80);
    --ink-3: oklch(0.66 0.007 80);
    --ink-4: oklch(0.52 0.007 80);
    --ink-5: oklch(0.38 0.008 80);
    --border: oklch(0.28 0.008 80);
    --border-strong: oklch(0.36 0.008 80);
    --border-input: oklch(0.32 0.008 80);
    --overlay: oklch(0.05 0.01 80 / 0.65);
    --primary-soft: oklch(0.28 0.06 var(--primary-h));
    --primary-soft-fg: oklch(0.88 0.07 var(--primary-h));
    --success-soft: oklch(0.28 0.05 155);
    --warning-soft: oklch(0.3 0.06 75);
    --danger-soft: oklch(0.3 0.06 25);
    --info-soft: oklch(0.28 0.05 245);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink-1);
    font-family: var(--font-body);
    font-size: var(--t-14);
    line-height: var(--d-row);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-display);
    font-weight: 500; letter-spacing: -0.02em; line-height: 1.1;
    margin: 0; color: var(--ink-1);
  }
  p { margin: 0; }
  button { font-family: inherit; }
  ::selection { background: var(--primary); color: var(--on-primary); }

  .scrolls::-webkit-scrollbar { width: 10px; height: 10px; }
  .scrolls::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  .scrolls::-webkit-scrollbar-thumb:hover { background: var(--ink-4); background-clip: content-box; border: 2px solid transparent; }
  .scrolls { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

  #root { height: 100%; }
  #root:empty::before { content: ""; display: block; height: 100vh; background: var(--bg); }
</style>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#f7f6f3">

        <rect x="120" y="0" width="48" height="48" rx="8" fill="#7C3AED"/>
        <rect x="180" y="0" width="48" height="48" rx="8" fill="#0EA5E9"/>
        <rect x="240" y="0" width="48" height="48" rx="8" fill="#F59E0B"/>
        <rect x="300" y="0" width="48" height="48" rx="8" fill="#E11D48"/>
        <rect x="360" y="0" width="48" height="48" rx="8" fill="#475569"/>
      </g>
      <rect x="740" y="180" width="380" height="540" rx="14" fill="white" stroke="#d8d6d0"/>
      <rect x="740" y="180" width="380" height="50" fill="#4F46E5"/>
      <g transform="translate(760 250)" fill="#e7e6e1">
        <rect width="120" height="14" rx="3"/>
        <rect y="30" width="200" height="10" rx="2"/>
        <rect y="50" width="160" height="10" rx="2"/>
        <rect y="90" width="340" height="80" rx="8"/>
      </g>
      <g transform="translate(760 460)">
        <rect width="100" height="32" rx="6" fill="#4F46E5"/>
        <rect x="116" width="100" height="32" rx="6" fill="white" stroke="#d8d6d0"/>
      </g>
    </svg>
  </template>

  <div id="root"></div>

  <script>
    // Tenant branding state — host rewrites this when the user adjusts via Tweaks.
    window.__TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "lang": "es",
      "previewSurface": "student",
      "previewDark": false,
      "previewDevice": "desktop"
    }/*EDITMODE-END*/;
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="preview.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
